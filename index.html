<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Land — Yuklanmoqda...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #1A1412;
      color: #F8F4EC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #251D19;
      border: 1px solid #3D312A;
      padding: 40px 32px;
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 24px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #D4AF37;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      color: #BBAEA6;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #B8864E;
      color: #1A1412;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 14px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #D4A368;
      transform: translateY(-1px);
    }
    .hint {
      font-size: 12px;
      color: #8C7B70;
      margin-top: 20px;
    }
    code {
      background: #140E0C;
      padding: 2px 6px;
      border-radius: 4px;
      color: #E5CCA9;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Coffee Land</div>
    <div class="spinner"></div>
    <h1>Sayt ochilmoqda...</h1>
    <p>Live Server avtomatik ravishda <strong>http://localhost:3000</strong> manziliga yo'naltirmoqda.</p>
    
    <a href="http://localhost:3000" class="btn" id="openBtn">To'g'ridan-to'g'ri o'tish →</a>
    
    <div class="hint">
      Agar avtomatik ochilmasa, terminalda <code>npm run dev</code> ishlab turganini tekshiring.
    </div>
  </div>

  <script>
    // Avtomatik tezkor yo'naltirish
    window.location.replace("http://localhost:3000");
  </script>
</body>
</html>
